[tool.poetry]
name = "myfinance"
version = "1.0.0"
description = "Aplicação para controle financeiro"
authors = ["Fernando Antunes <ferantunesdev@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
asgiref = "^3.9.1"
certifi = ">=2026.1"
cffi = ">=2,<3"
chardet = "5.2.0"
charset-normalizer = ">=3.4,<4"
cryptography = ">=46,<49"
defusedxml = "0.7.1"
django = ">=5.2.19,<5.3"
django-upload-validator = "1.1.6"
djangorestframework = ">=3.16.1,<3.17"
djangorestframework-simplejwt = "^5.5.1"
et-xmlfile = "1.1.0"
hvac = "1.2.1"
idna = ">=3.11,<4"
mysqlclient = "^2.2.4"
oauthlib = ">=4.0.1,<5"
openpyxl = "3.1.2"
pillow = "^11.1.0"
psycopg2 = "^2.9.10"
pycparser = ">=2.22,<4"
pyhcl = "0.4.5"
pyjwt = ">=2.10,<3"
python-dateutil = "2.8.2"
python-dotenv = "1.0.0"
python-magic = "0.4.27"
python3-openid = "3.2.0"
pytz = "2023.3.post1"
requests = ">=2.34,<3"
requests-oauthlib = ">=2,<3"
six = "1.16.0"
social-auth-app-django = ">=8.1,<9"
social-auth-core = ">=7.2,<8"
sqlparse = "^0.5.3"
urllib3 = ">=2.6,<3"
gunicorn = "^22.0.0"
channels = "^4.2.0"
daphne = "^4.1.2"
channels-redis = "^4.2.1"
django-extensions = "^3.2.3"
python-jose = "^3.4.0"
django-oauth-toolkit = "^3.0.1"
reportlab = ">=4.4,<5"
django-otp = ">=1.7.5,<2"
segno = ">=1.6,<2"


[tool.poetry.group.dev.dependencies]
blue = "^0.9.1"
isort = "^5.13.2"
pytest = "^8.3.5"
pytest-django = "^4.10.0"
pytest-mock = "^3.14.0"
playwright = "^1.64.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.blue]
line-lenght = 120

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "myfinance.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
