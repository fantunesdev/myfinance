[project]
name = "myfinance"
version = "1.0.0"
description = "Aplicação para controle financeiro"
authors = [{name = "Fernando Antunes", email = "ferantunesdev@gmail.com"}]
readme = "README.md"
requires-python = ">=3.15,<3.16"
dynamic = ["dependencies"]

[tool.poetry.dependencies]
python = ">=3.15,<3.16"
asgiref = "^3.13.0"
certifi = "^2026.11.20"
cffi = "^2.1.1"
chardet = "^7.7.0"
charset-normalizer = "^3.5.3"
cryptography = "^50.0.2"
defusedxml = "^0.7.1"
django = "^6.1.3"
django-upload-validator = "^1.1.6"
djangorestframework = "^3.18.3"
djangorestframework-simplejwt = "^5.5.1"
et-xmlfile = "^2.0.0"
hvac = "^2.4.0"
idna = "^3.20"
mysqlclient = "^2.3.2"
oauthlib = "^4.0.1"
openpyxl = "^3.1.5"
pillow = "^13.0.0"
psycopg2 = "^2.9.13"
pycparser = "^3.12"
pyhcl = "^0.4.5"
pyjwt = "^2.15.1"
python-dateutil = "^4.0.0"
python-dotenv = "^1.2.4"
python-magic = "^0.4.27"
python3-openid = "^3.2.0"
pytz = "^2026.6"
requests = "^2.34.2"
requests-oauthlib = "^2.0.0"
six = "^1.17.0"
social-auth-app-django = "^8.1.0"
social-auth-core = "^7.2.0"
sqlparse = "^0.6.1"
urllib3 = "^2.8.0"
gunicorn = "^27.0.1"
channels = "^4.3.2"
daphne = "^4.2.3"
channels-redis = "^4.3.0"
django-extensions = "^4.1"
python-jose = "^3.5.0"
django-oauth-toolkit = "^3.4.1"
reportlab = "^5.1.2"
django-otp = "^1.7.5"
segno = "^1.6.6"


[tool.poetry.group.dev.dependencies]
ruff = "^0.17.6"
isort = "^9.0.2"
pytest = "^9.2.0"
pytest-django = "^4.14.0"
pytest-mock = "^3.17.0"
playwright = "^1.65.2"

[build-system]
requires = ["poetry-core>=2.5,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.format]
quote-style = "single"
