name: MyFinance CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Não cancela um deploy em andamento quando chega outro push.
concurrency:
  group: myfinance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-tests-only
          MYSQL_DATABASE: myfinance_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=ci-tests-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Validar versão da infraestrutura
        env:
          INFRA_REF: ${{ vars.MYFINANCE_INFRA_REF }}
        run: '[[ "$INFRA_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Configure MYFINANCE_INFRA_REF com o SHA da infraestrutura"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          repository: fantunesdev/docker
          ref: ${{ vars.MYFINANCE_INFRA_REF }}
          token: ${{ secrets.MYFINANCE_INFRA_TOKEN || github.token }}
          path: infra
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: infra/myfinance
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - name: Instalar dependências de teste
        working-directory: infra/myfinance
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev libpq-dev libmagic1
          python -m pip install poetry==2.5.2
          poetry check --lock
          poetry install --no-root --no-interaction
          npm ci --ignore-scripts
      - name: Testes Python e JavaScript
        working-directory: infra/myfinance
        run: |
          poetry run coverage run -m pytest --ds=myfinance.test_settings tests
          node --test tests/js/*.test.mjs
      - name: Relatórios de cobertura Python
        if: ${{ always() && !cancelled() }}
        working-directory: infra/myfinance
        run: |
          poetry run coverage xml --fail-under=0
          poetry run coverage html --fail-under=0
          poetry run coverage report
      - name: Publicar relatórios de cobertura
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            infra/myfinance/coverage.xml
            infra/myfinance/htmlcov/
          if-no-files-found: warn
      - name: Testes com MySQL
        working-directory: infra/myfinance
        env:
          MYFINANCE_TEST_MYSQL_PASSWORD: ci-tests-only
        run: poetry run pytest --ds=myfinance.mysql_test_settings tests
      - name: Validar infraestrutura de deploy
        working-directory: infra
        run: |
          for script in mfupdate mfcompose deploy/ci-deploy.sh; do sh -n "$script"; done
          python -m unittest discover -s tests -v
      - name: Identificar imagem
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir imagem; publicar somente após testes
        id: build
        uses: docker/build-push-action@v6
        with:
          context: infra
          file: infra/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
            io.myfinance.infrastructure.revision=${{ vars.MYFINANCE_INFRA_REF }}

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.MYFINANCE_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, myfinance-deploy]
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Verificar se este commit ainda é o mais recente da main
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/main"
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              current = json.load(response)['object']['sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"deploy={'true' if current == os.environ['GITHUB_SHA'] else 'false'}\n")
          if current != os.environ['GITHUB_SHA']:
              print('Commit ultrapassado; o workflow mais recente fará o deploy.')
          PY
      - name: Publicar imagem aprovada na VM
        if: steps.current.outputs.deploy == 'true'
        env:
          IMAGE: ${{ needs.ci.outputs.image }}@${{ needs.ci.outputs.digest }}
          COMMIT: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          SSH_HOST: ${{ vars.MYFINANCE_SSH_HOST || 'producao' }}
          DEPLOY_BASEDIR: ${{ vars.MYFINANCE_BASEDIR || '/docker/myfinance' }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REGISTRY_USER" =~ ^[a-zA-Z0-9_-]+(\[bot\])?$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.@-]*$ ]]
          [[ "$DEPLOY_BASEDIR" =~ ^/[a-zA-Z0-9_/-]+$ ]]
          printf '%s' "$GHCR_TOKEN" | ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_HOST" \
            "BASEDIR='$DEPLOY_BASEDIR' DEPLOY_IMAGE='$IMAGE' DEPLOY_COMMIT='$COMMIT' REGISTRY_USER='$REGISTRY_USER' sh '$DEPLOY_BASEDIR/deploy/ci-deploy.sh'"
